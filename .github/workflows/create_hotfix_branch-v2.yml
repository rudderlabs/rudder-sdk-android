name: Create new hotfix branch for v2

on:
  workflow_dispatch:
    inputs:
      hotfix_name:
        description: Hotfix branch name for v2
        required: true

permissions: {}

jobs:
  create-hotfix-branch-v2:
    name: Create new branch for v2
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master-v2'
    permissions:
      contents: write # action-create-branch creates the hotfix branch with GITHUB_TOKEN
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Set env BRANCH_NAME
        run: |
          echo "BRANCH_NAME=hotfix-v2" >> "$GITHUB_ENV"

      - name: Create branch
        uses: peterjgrainger/action-create-branch@10c7d268152480ae859347db45dc69086cef1d9c # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          branch: '${{ env.BRANCH_NAME }}/${{ github.event.inputs.hotfix_name }}-v2'
