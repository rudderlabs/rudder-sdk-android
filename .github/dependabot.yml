
version: 2
updates:
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'monthly'
    open-pull-requests-limit: 0
    cooldown:
      default-days: 7
      exclude:
        - 'rudderlabs/*'

  - package-ecosystem: 'gradle'
    directory: '/'
    schedule:
      interval: 'monthly'
    open-pull-requests-limit: 0
    cooldown:
      default-days: 7
      exclude:
        - 'com.rudderstack.*'

  - package-ecosystem: 'gradle'
    directory: '/sample-js-integration/RudderAndroidJS'
    schedule:
      interval: 'monthly'
    open-pull-requests-limit: 0
    cooldown:
      default-days: 7
      exclude:
        - 'com.rudderstack.*'
