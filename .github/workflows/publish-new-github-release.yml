# release-please creates the v-prefixed tag and GitHub release from master.
# This workflow preserves the active v1 post-release back-merge.

name: Post Release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  post-release:
    name: Back-merge master into develop
    runs-on: ubuntu-latest
    environment: deployment
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Generate GitHub App token
        id: generate-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write

      - name: Checkout master
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          token: ${{ steps.generate-token.outputs.token }}
          ref: master
          fetch-depth: 0
          persist-credentials: false

      - name: Validate release branch and tag
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Release tag $TAG does not follow the active v1 Android SDK convention."
            exit 1
          fi

          git fetch --force origin "refs/tags/${TAG}:refs/tags/${TAG}"
          if ! git merge-base --is-ancestor "${TAG}^{commit}" HEAD; then
            echo "Release tag $TAG does not point to a commit on master."
            exit 1
          fi

      - name: Raise back-merge pull request
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
          VERSION: ${{ github.event.release.tag_name }}
        run: |
          existing_pr=$(gh pr list \
            --base develop \
            --head master \
            --state open \
            --json url \
            --jq '.[0].url // empty')

          if [[ -n "$existing_pr" ]]; then
            echo "Back-merge pull request already exists: $existing_pr"
            exit 0
          fi

          gh pr create \
            --base develop \
            --head master \
            --title "chore(release): pulling master into develop post release $VERSION" \
            --body "Automated back-merge of active v1 release $VERSION from \`master\` into \`develop\`."
